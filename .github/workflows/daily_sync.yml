name: Kindle to Hardcover Sync

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of books to check (0 for all)'
        required: false
        default: '10'
      dry_run:
        description: 'Preview only — do not add or remove anything'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync_books:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Sync Read Shelf
      continue-on-error: true
      env:
        GOODREADS_RSS_URL: ${{ secrets.GOODREADS_RSS_URL }}
        HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
      run: |
        LIMIT="${{ inputs.limit }}"
        if [ -z "$LIMIT" ]; then LIMIT="10"; fi
        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
        # Node script accepts --limit. 0 means all.
        npm run sync -- --shelf read --limit $LIMIT $DRY_RUN_FLAG

    - name: Sync Want to Read Shelf
      continue-on-error: true
      env:
        GOODREADS_RSS_URL_TOREAD: ${{ secrets.GOODREADS_RSS_URL_TOREAD }}
        HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
      run: |
        LIMIT="${{ inputs.limit }}"
        if [ -z "$LIMIT" ]; then LIMIT="10"; fi
        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
        npm run sync -- --shelf toread --limit $LIMIT $DRY_RUN_FLAG

    - name: Sync Book Club Shelf
      continue-on-error: true
      env:
        GOODREADS_RSS_URL_BOOKCLUB: ${{ secrets.GOODREADS_RSS_URL_BOOKCLUB }}
        HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
      run: |
        LIMIT="${{ inputs.limit }}"
        if [ -z "$LIMIT" ]; then LIMIT="10"; fi
        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
        npm run sync -- --shelf bookclub --limit $LIMIT $DRY_RUN_FLAG

    - name: Sync Reading Progress
      continue-on-error: true
      env:
        GOODREADS_UPDATES_RSS_URL: ${{ secrets.GOODREADS_UPDATES_RSS_URL }}
        HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
      run: |
        LIVE_FLAG="--live"
        if [ "${{ inputs.dry_run }}" = "true" ]; then LIVE_FLAG=""; fi
        node scripts/sync_progress.js $LIVE_FLAG

    - name: Commit sync state
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p .sync-state
        git add .sync-state
        git diff --cached --quiet || git commit -m "Update sync state [skip ci]"
        git push

name: Audit Format Switch (diagnostic)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: npm install
    - name: Audit
      env:
        HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
      run: node scripts/audit_format_switch.js
